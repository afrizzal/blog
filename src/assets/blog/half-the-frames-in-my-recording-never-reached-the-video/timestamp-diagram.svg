<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" role="img" aria-labelledby="title desc">
  <title id="title">Synthetic capture timestamp selection at 30 fps</title>
  <desc id="desc">Capture timestamps 0, 12, 28, 45, 62, 79, 95 milliseconds share a linear 0–100 millisecond scale with four evenly spaced output ticks. Each tick selects the last capture at or before it: 0, 28, 62, 95 milliseconds. Hollow circles at 12, 45, 79 milliseconds are never picked. Blue hold segments show the duration of picked frames. Output labels are rounded only for display.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M 1 1 L 7 4 L 1 7" fill="none" stroke="#9aa4b2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect x="0" y="0" width="720" height="540" fill="#0d1526"/>
  <text x="32" y="48" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, ui-monospace, monospace" font-size="22" fill="#6e7681" text-anchor="start" letter-spacing="2">SYNTHETIC EXAMPLE</text>
  <text x="32" y="90" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="25" fill="#e6edf3" text-anchor="start">Capture timestamps (ms)</text>
  <path d="M 48 270 H 672" fill="none" stroke="#243048" stroke-width="2"/>
  <rect x="49" y="151" width="72.88" height="10" fill="#60a5fa" opacity="0.55"/>
  <rect x="123.88" y="151" width="97.84" height="10" fill="#243048"/>
  <rect x="223.72" y="151" width="104.08" height="10" fill="#60a5fa" opacity="0.55"/>
  <rect x="329.8" y="151" width="104.08" height="10" fill="#243048"/>
  <rect x="435.88" y="151" width="104.08" height="10" fill="#60a5fa" opacity="0.55"/>
  <rect x="541.96" y="151" width="97.84" height="10" fill="#243048"/>
  <rect x="641.8" y="151" width="30.2" height="10" fill="#60a5fa" opacity="0.55"/>
  <path d="M 48 260 L 48 169" fill="none" stroke="#9aa4b2" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 256 260 L 226.682 168.382" fill="none" stroke="#9aa4b2" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 464 260 L 438.385 168.519" fill="none" stroke="#9aa4b2" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 672 260 L 644.536 168.452" fill="none" stroke="#9aa4b2" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="48" cy="156" r="9" fill="#60a5fa" stroke="#0d1526" stroke-width="2"/>
  <text x="48" y="129" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, ui-monospace, monospace" font-size="22" fill="#9aa4b2" text-anchor="middle">0</text>
  <circle cx="122.88" cy="156" r="9" fill="#0d1526" stroke="#6e7681" stroke-width="2"/>
  <text x="122.88" y="129" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, ui-monospace, monospace" font-size="22" fill="#9aa4b2" text-anchor="middle">12</text>
  <circle cx="222.72" cy="156" r="9" fill="#60a5fa" stroke="#0d1526" stroke-width="2"/>
  <text x="222.72" y="129" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, ui-monospace, monospace" font-size="22" fill="#9aa4b2" text-anchor="middle">28</text>
  <circle cx="328.8" cy="156" r="9" fill="#0d1526" stroke="#6e7681" stroke-width="2"/>
  <text x="328.8" y="129" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, ui-monospace, monospace" font-size="22" fill="#9aa4b2" text-anchor="middle">45</text>
  <circle cx="434.88" cy="156" r="9" fill="#60a5fa" stroke="#0d1526" stroke-width="2"/>
  <text x="434.88" y="129" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, ui-monospace, monospace" font-size="22" fill="#9aa4b2" text-anchor="middle">62</text>
  <circle cx="540.96" cy="156" r="9" fill="#0d1526" stroke="#6e7681" stroke-width="2"/>
  <text x="540.96" y="129" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, ui-monospace, monospace" font-size="22" fill="#9aa4b2" text-anchor="middle">79</text>
  <circle cx="640.8" cy="156" r="9" fill="#60a5fa" stroke="#0d1526" stroke-width="2"/>
  <text x="640.8" y="129" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, ui-monospace, monospace" font-size="22" fill="#9aa4b2" text-anchor="middle">95</text>
  <path d="M 48 260 V 280" stroke="#22d3ee" stroke-width="3"/>
  <text x="48" y="311" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, ui-monospace, monospace" font-size="22" fill="#e6edf3" text-anchor="middle">0</text>
  <path d="M 256 260 V 280" stroke="#22d3ee" stroke-width="3"/>
  <text x="256" y="311" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, ui-monospace, monospace" font-size="22" fill="#e6edf3" text-anchor="middle">33.3</text>
  <path d="M 464 260 V 280" stroke="#22d3ee" stroke-width="3"/>
  <text x="464" y="311" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, ui-monospace, monospace" font-size="22" fill="#e6edf3" text-anchor="middle">66.7</text>
  <path d="M 672 260 V 280" stroke="#22d3ee" stroke-width="3"/>
  <text x="672" y="311" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, ui-monospace, monospace" font-size="22" fill="#e6edf3" text-anchor="middle">100</text>
  <text x="32" y="351" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="25" fill="#e6edf3" text-anchor="start">Output clock, 30 fps (ms)</text>
  <circle cx="42" cy="389" r="9" fill="#60a5fa" stroke="#0d1526" stroke-width="2"/>
  <text x="61" y="397" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" fill="#9aa4b2" text-anchor="start">picked by an output tick</text>
  <circle cx="440" cy="389" r="9" fill="#0d1526" stroke="#6e7681" stroke-width="2"/>
  <text x="459" y="397" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" fill="#9aa4b2" text-anchor="start">never picked</text>
  <rect x="32" y="422" width="20" height="10" fill="#60a5fa" opacity="0.55"/>
  <text x="61" y="435" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" fill="#9aa4b2" text-anchor="start">on screen when a tick lands</text>
  <text x="24" y="474" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" fill="#6e7681" text-anchor="start">33.3 and 66.7 are rounded for display;</text>
  <text x="24" y="504" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" fill="#6e7681" text-anchor="start">the selection uses 100/3 and 200/3 exactly.</text>
</svg>
