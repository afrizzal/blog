<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 944" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="400">
<title>What one tutorial part goes through</title>
<desc>What one tutorial part goes through: Capture take; Thin take; Build data; Checks + bundle; Render + encode; Finish audio; Subtitles, cover, guide; QA; Owner review.</desc>
